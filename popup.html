<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Arial, sans-serif; width: 380px; padding: 12px; }
      label { display:block; margin-top:10px; font-size:12px; color:#333; font-weight:bold; }
      input[type="text"], input[type="date"], select, textarea { width:100%; padding:6px; box-sizing:border-box; margin-top:4px; }
      button { margin-top:10px; padding:8px 12px; margin-right:4px; }
      .small { font-size:12px; color:#666; margin-top:6px; }
      .row { display:flex; gap:8px; align-items:center; }
      .row > * { flex:1; }
      #previewRow { margin-top:8px; display:flex; gap:8px; align-items:center; }
      #previewBox { flex:1; }
      .info-box { background:#f0f8ff; padding:8px; border-radius:4px; margin-bottom:12px; font-size:12px; }
      .note-grey { color:#888; font-size:11px; margin-top:12px; }
      .warning { color:#a00; font-weight:bold; margin-top:8px; }
      button:disabled { opacity:0.6; cursor:not-allowed; }
    </style>
  </head>
  <body>
    <div class="info-box">🎯 Internal Title field auto-detected</div>

    <label>Case code → definition</label>
    <select id="codeSelect"></select>

    <label class="small">
      <input id="preserveRest" type="checkbox" /> Replace only leading code (preserve the rest of the title)
    </label>

    <label>📅 Next Contact Date (Optional)</label>
    <input id="dateInput" type="date" />
    <div class="small" style="margin-top:4px;">Format in string: NC: DD-Month (e.g., NC: 04-July)</div>

    <div id="previewRow">
      <input id="previewBox" type="text" readonly placeholder="Preview will appear here" />
      <button id="copyBtn">Copy</button>
    </div>

    <div class="row">
      <button id="apply">Apply</button>
      <button id="preview">Preview</button>
    </div>

    <div id="status" class="small"></div>

    <div id="warning" class="warning" style="display:none;">Cannot detect DFM</div>

    <div class="note-grey">Data is stored locally only.</div>

    <script src="popup.js"></script>
  </body>
</html>
